# v0.2 bundled exempt-app catalog. Each entry must match BOTH signature
# (Valid + TeamID/BundleID/Pkg) AND identity (exe basename or bundle id).
# Scripting interpreters and shell tools are intentionally NOT here — they
# are always filtered. See DESIGN.md §4.4 (the Python problem).

