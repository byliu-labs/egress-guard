# Apple system services — exec-path match, since they're not bundled apps.
[[macos]]
exe_basename = "nsurlsessiond"
team_id      = "APPLE"

[[macos]]
exe_basename = "trustd"
team_id      = "APPLE"

[[macos]]
exe_basename = "softwareupdated"
team_id      = "APPLE"

[[macos]]
exe_basename = "apsd"
team_id      = "APPLE"

[[macos]]
exe_basename = "cloudd"
team_id      = "APPLE"

# ============================================================
# Linux: by package ownership (TeamID = package name on linux)
# ============================================================

[[linux]]
exe_basename = "firefox"
package      = "firefox"

[[linux]]
exe_basename = "google-chrome"
package      = "google-chrome-stable"

[[linux]]
exe_basename = "systemd-resolved"
package      = "systemd"

[[linux]]
exe_basename = "NetworkManager"
package      = "network-manager"

[[linux]]
exe_basename = "gnome-shell"
package      = "gnome-shell"

