name: diag-trustd
on:
  push:
    branches: [diag/trustd-codesign]
jobs:
  probe:
    strategy:
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    runs-on: macos-latest
    steps:
      - run: |
          sw_vers
          uname -a
          codesign -dvv /usr/libexec/trustd 2>&1
          codesign -dvv /usr/bin/curl 2>&1 | grep -E 'Authority|TeamIdentifier'
          ls -l /usr/libexec/trustd
          shasum -a 256 /usr/libexec/trustd
